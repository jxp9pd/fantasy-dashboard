# Include inside jpentakalos.com's existing server block.
location = /fantasy-dashboard {
    return 301 /fantasy-dashboard/$is_args$args;
}

location ^~ /fantasy-dashboard/ {
    alias /var/www/fantasy-dashboard/current/;
    index index.html;
    # Revalidate HTML and snapshots, including through Cloudflare.
    add_header Cache-Control "no-cache" always;
}
