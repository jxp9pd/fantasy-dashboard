name: Refresh and deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    # Daily at 13:00 UTC (06:00 PDT / 05:00 PST).
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pipeline
        run: python -m pip install -e '.[dev]'
      - name: Test pipeline with offline fixtures
        run: pytest
      - name: Restore source cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nflverse-2026-${{ github.run_id }}
          restore-keys: nflverse-2026-
      - name: Build current 2026 snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m pipeline.build --season 2026 --out web/public/data
      - name: Reconcile snapshot against source data
        run: pytest -m realdata
      - name: Install frontend
        working-directory: web
        run: npm ci
      - name: Check, test, and build frontend
        working-directory: web
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Check layout and accessibility
        working-directory: web
        run: npm run e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: web/test-results
          if-no-files-found: ignore
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified snapshot
        id: deployment
        uses: actions/deploy-pages@v4
