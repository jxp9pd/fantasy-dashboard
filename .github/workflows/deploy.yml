name: Refresh and deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    # Daily at 13:00 UTC (06:00 PDT / 05:00 PST).
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fantasy-dashboard-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pipeline
        run: python -m pip install -e '.[dev]'
      - name: Test pipeline with offline fixtures
        run: pytest
      - name: Restore source cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: nflverse-2026-${{ github.run_id }}
          restore-keys: nflverse-2026-
      - name: Build current 2026 snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m pipeline.build --season 2026 --out web/public/data
      - name: Reconcile snapshot against source data
        run: pytest -m realdata
      - name: Install frontend
        working-directory: web
        run: npm ci
      - name: Check, test, and build frontend
        working-directory: web
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Check layout and accessibility
        working-directory: web
        run: npm run e2e
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: web/test-results
          if-no-files-found: ignore
      - name: Upload verified dashboard
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jpentakalos.com/fantasy-dashboard/
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: dist
      - name: Publish verified snapshot to Hetzner
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/dashboard_deploy' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/dashboard_deploy
          chmod 600 ~/.ssh/dashboard_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          tar -czf dashboard.tar.gz -C dist .
          # The key can only run the server's static-release receiver.
          ssh -i ~/.ssh/dashboard_deploy -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 "fantasy-deploy@$DEPLOY_HOST" \
            < dashboard.tar.gz
      - name: Verify public dashboard and all position snapshots
        run: |
          set -euo pipefail
          for path in '' 'metric-notes.html' 'data/wr.json' 'data/rb.json' 'data/te.json'; do
            curl --fail --silent --show-error --retry 3 \
              "https://jpentakalos.com/fantasy-dashboard/$path" -o /dev/null
          done
